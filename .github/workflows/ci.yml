name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately. `-D warnings` plus a floating toolchain means a new
      # Rust release turns this build red with nobody having touched the code --
      # which is exactly what happened: CI's stable moved to 1.98.0, which added
      # `clippy::drain_collect`, and the job failed on code that had not changed.
      # `check` and `test` below stay on floating stable, so a real
      # incompatibility with a new compiler still surfaces; only the lint gate is
      # deterministic. Bumping this is a deliberate commit that carries its own
      # fixes with it.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned for the same reason as clippy: rustfmt's output changes between
      # releases, and a formatter that gates must not also move on its own.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # The C sources were compiled by nothing. CI ran cargo check, cargo test,
  # clippy and fmt -- all Rust -- while src/*.c sat unbuilt, and
  # src/flux_runtime_arm.c did not compile at all: its header declared
  # int32_t and uint16_t without including <stdint.h>, and the file included
  # <stdint.h> after the header rather than before. Fixing that exposed a
  # second error underneath, a duplicated pair of declarations in flux_check,
  # which nothing had reached because the build died earlier.
  #
  # Neither would have been found by reading. Both are found by compiling, so
  # this job compiles.
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every C source compiles, warnings included
        run: |
          for f in src/*.c; do
            echo "== $f"
            gcc -c -std=c11 -Wall -Wextra -Werror -Isrc -Iinclude "$f" -o /dev/null
          done

      # A header that only compiles when something else was included first is
      # a trap for the next translation unit that includes it, and is exactly
      # what broke here. Each header is compiled alone.
      - name: Every header stands on its own
        run: |
          for h in src/*.h include/*.h; do
            [ -e "$h" ] || continue
            echo "== $h"
            printf '#include "%s"\nint main(void){return 0;}\n' "$(basename "$h")" > /tmp/probe.c
            gcc -fsyntax-only -std=c11 -Wall -Wextra -Werror -Isrc -Iinclude /tmp/probe.c
          done
